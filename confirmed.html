<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match Manager — you're all set</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#040b24; font-family:-apple-system, "Segoe UI", Roboto, sans-serif; }
  .card { text-align:center; padding:40px 28px; max-width:420px; }
  h1 { color:#ffffff; font-size:26px; margin:0 0 10px; }
  p  { color:#96cbf0; font-size:16px; line-height:1.5; margin:0; }
  .tick { width:72px; height:72px; border-radius:50%; background:#22c55e; color:#fff;
          font-size:40px; line-height:72px; margin:0 auto 22px; }
</style>
</head>
<body>
  <div class="card">
    <div class="tick">✓</div>
    <h1>You're all set</h1>
    <p>Your email is confirmed. Head back to the Match Manager app on your phone and sign in.</p>
  </div>
</body>
</html>
